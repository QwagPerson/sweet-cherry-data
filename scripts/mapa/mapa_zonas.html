}

// Función alternativa más fácil
function descargarMapa() {
    var canvas = document.querySelector('canvas');
    if (canvas) {
        var img = canvas.toDataURL();
        var link = document.createElement('a');
        link.href = img;
        link.download = 'mapa_zonas.png';
        link.click();
    }
}
